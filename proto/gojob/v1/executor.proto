// The executor contract.
//
// This file is the single source of truth for how a scheduler and an executor talk.
// It is generated into every executor's language, so a missing method or a wrong field
// type is a build failure rather than something discovered at registration time.
//
// Two services, in opposite directions:
//
//   JobExecutor  — hosted by the executor,  called by the scheduler
//   JobScheduler — hosted by the scheduler, called by the executor
//
// An executor implements JobExecutor completely. There is no partial implementation:
// generated stubs make every method mandatory, and section "Conformance" in doc/dispatch.md
// describes how that is enforced per language.
syntax = "proto3";

package gojob.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/abcdeqwer/go-job/gen/gojob/v1;gojobv1";
option java_multiple_files = true;
option java_package = "com.gojob.v1";

// ---------------------------------------------------------------------------
// Executor-hosted service. The scheduler calls these.
// ---------------------------------------------------------------------------
service JobExecutor {
  // Describe reports what this executor is and can do.
  //
  // The scheduler calls it during registration, before routing any work, and treats a
  // failure as a refused registration. It is also how contract-version compatibility is
  // established.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // Run hands over one execution.
  //
  // It returns immediately — the executor must NOT run the job before answering. An OK
  // response is a promise that a result will eventually be reported through
  // JobScheduler.ReportResult.
  //
  // Errors carry meaning and are part of the contract:
  //   ALREADY_EXISTS      this (tenant, execution_key) is already held. The error's
  //                       ExecutionHeld detail carries the run_token actually held, because
  //                       "already held" is two different situations: a re-send of the SAME
  //                       attempt after a timeout (adopt it), or a NEW attempt colliding
  //                       with an older one the scheduler already fenced (do not adopt —
  //                       the old handler is still running and this attempt never started)
  //   RESOURCE_EXHAUSTED  at capacity; the scheduler will try another instance
  //   UNAVAILABLE         shutting down; the scheduler will try another instance
  //   FAILED_PRECONDITION unknown handler_key
  rpc Run(RunRequest) returns (RunResponse);

  // Cancel asks the executor to stop an execution.
  //
  // Acknowledgement means the stop was signalled, not that work has ceased. Cancellation
  // is cooperative; the executor still reports a result when the work actually ends.
  rpc Cancel(CancelRequest) returns (CancelResponse);

  // GetExecution answers what happened to an execution the scheduler has lost track of.
  //
  // It is reliable for one question only: "are you running this right now?" A process that
  // has restarted has no memory of earlier work and answers NOT_FOUND, which means
  // UNKNOWN — never "it did not run". Durable proof that work happened belongs in the
  // handler's own idempotency key, not here.
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse);
}

// ---------------------------------------------------------------------------
// Scheduler-hosted service. Executors call these.
// ---------------------------------------------------------------------------
// Every call in both directions is authenticated at the transport: mutual TLS, or a
// pre-shared credential carried in metadata. This is not optional hardening.
//
// The dispatch endpoint executes work on request, so an unauthenticated JobExecutor is
// remote code execution by configuration. And an unauthenticated JobScheduler would let any
// process register itself for any tenant, declare a valuable handler, advertise capacity,
// and be handed that tenant's parameters and executions by ordinary round-robin routing —
// physical database isolation does not protect a dispatch path that trusts its callers.
//
// The scheduler binds the authenticated identity to what it may claim: an identity is
// authorized for a set of tenants and executor groups, and a Register naming anything
// outside that set is refused. Identity is never taken from the request body.
service JobScheduler {
  // Register announces an executor and its handlers. The scheduler probes the executor
  // (Describe, plus a GetExecution for a key it cannot hold) before accepting.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Heartbeat keeps a registration alive. A response with known=false means the
  // registration lapsed and the executor must call Register again.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // ReportProgress extends an execution's deadline and asks whether to continue.
  //
  // The executor's framework calls this on a timer while a handler runs. It must not
  // depend on the handler cooperating: the handlers most likely to run for hours are the
  // least able to check in.
  rpc ReportProgress(ReportProgressRequest) returns (ReportProgressResponse);

  // ReportResult delivers a terminal outcome. Idempotent on (tenant, execution_key,
  // run_token): a redelivery of a result already recorded returns OK with
  // already_recorded=true, so a lost response never turns into a spurious ABORTED.
  //
  //   ABORTED   this attempt was fenced by a DIFFERENT token; discard and do not retry
  //   NOT_FOUND unknown execution; discard
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);
}

// ---------------------------------------------------------------------------
// Parameters
// ---------------------------------------------------------------------------

// JobParams is what a handler receives from the scheduler.
//
// It is a JSON-shaped structure so every language's protobuf runtime can carry it and the
// admin UI can edit it directly. Its value is merged from the job's configured defaults
// and any per-trigger override, then snapshotted onto the execution when it is created —
// so history shows what each run actually ran with, even after the configuration changes.
//
// Three rules, enforced by the scheduler:
//   - parameters are DATA, never instructions. No command lines, scripts, URLs to fetch or
//     handler names. The executor resolves handler_key against its own registry; the
//     scheduler holds no handler code at all.
//   - size is bounded, and the bound is rejected at the API rather than discovered when a
//     row overflows.
//   - no secrets. Parameters are stored, displayed and written to history; an executor
//     reads credentials from its own configuration.
//
// Values a handler can derive should be derived: scheduled_at accompanies every dispatch,
// so a daily job computes its own business date rather than being told one that can drift
// from the instant it belongs to.
message JobParams {
  google.protobuf.Struct values = 1;
}

// ---------------------------------------------------------------------------
// JobExecutor messages
// ---------------------------------------------------------------------------

message DescribeRequest {}

message DescribeResponse {
  // Contract version this executor was generated against. The scheduler refuses to
  // register an incompatible executor rather than discovering the mismatch mid-dispatch.
  string contract_version = 1;

  // Handlers this executor can run. A job routes to a group declaring its handler_key.
  repeated string handler_keys = 2;

  // Concurrent executions this instance is willing to hold. ADVISORY: schedulers use it to
  // spread load, but it cannot be enforced atomically — two scheduler instances may select
  // the same executor at the same moment, and a process registered for several tenants
  // advertises capacity separately in each.
  //
  // The authoritative limit is therefore the executor's own RESOURCE_EXHAUSTED, which it
  // must return whenever accepting would exceed what it can actually run, counted across
  // ALL tenants it serves.
  int32 capacity = 3;

  // Build identity, for the admin UI and for rollout diagnosis.
  string revision = 4;

  // Optional capabilities. Absence is not an error: it downgrades what the scheduler
  // offers for jobs routed here, visibly, rather than failing at runtime.
  repeated Capability capabilities = 5;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;

  // Cancel is honoured. Without it the admin UI disables cancellation for this executor
  // instead of offering a button that does nothing.
  CAPABILITY_CANCEL = 1;

  // Handler-supplied progress messages, beyond the framework's automatic keepalive.
  CAPABILITY_PROGRESS_DETAIL = 2;
}

message RunRequest {
  // Durable identity of one logical run, unique WITHIN A TENANT. The executor's
  // deduplication key is therefore (tenant, execution_key) — never execution_key alone,
  // which would let one multi-tenant executor conflate two tenants' work.
  string execution_key = 1;

  // Identity of this attempt. Presented back with every progress and result call, and
  // refused once fenced.
  string run_token = 2;

  string tenant = 3;
  string job_name = 4;
  string handler_key = 5;
  int32 attempt = 6;

  // Business time of the fire instant this execution belongs to, RFC 3339.
  string scheduled_at = 7;

  // How long the executor may stay silent before the scheduler treats this attempt as lost,
  // in seconds, counted from receipt. Extended by every ReportProgress.
  //
  // Deliberately a DURATION, not an absolute instant. Silence is an ownership decision, and
  // ownership timestamps live in the scheduler's database clock; sending an absolute time
  // would force the executor to compare it against its own clock and make liveness depend
  // on skew between machines. A duration needs no shared clock at all.
  //
  // It bounds silence, not runtime — see timeout_seconds for the runtime cap.
  int32 silence_deadline_seconds = 8;

  // Runtime budget REMAINING for this attempt, in seconds, counted from receipt.
  //
  // Not the job's configured cap: the scheduler's clock on that cap starts when the
  // execution is claimed, and dispatch can take measurable time — an unknown-outcome
  // re-send is bounded but not instant. Sending the full cap would give the executor a
  // later deadline than the scheduler is enforcing, so the scheduler would fence an
  // execution the executor still believed it was entitled to run, and a successor could
  // overlap it. Sending what is left makes both sides agree by construction.
  //
  // A dispatch whose remaining budget has already elapsed is not sent at all.
  //
  // Enforced on both sides, because neither alone is sufficient: the executor abandons the
  // handler and reports failure with failure_kind "timeout"; the scheduler independently
  // fences the attempt when the cap passes without a result, sends Cancel, and resolves the
  // execution with terminal_reason "timeout". A handler that ignores cancellation cannot be
  // stopped by anyone — the fence bounds the damage, and the residue is visible rather than
  // silently tolerated.
  int32 remaining_timeout_seconds = 9;

  JobParams params = 10;
}

message RunResponse {
  // Echoed for correlation in logs. Acceptance is signalled by an OK status, not a field:
  // a refusal is an error code, so no caller can ignore it by forgetting to read a bool.
  string execution_key = 1;

  // The token the executor is now running. Equal to RunRequest.run_token on a fresh accept.
  string run_token = 2;
}

// Detail attached to an ALREADY_EXISTS error from Run, and to GetExecutionResponse.
// It answers "held by which attempt?", which the key alone cannot.
message ExecutionHeld {
  string held_run_token = 1;
}

message CancelRequest {
  string tenant = 1;
  string execution_key = 2;
  string run_token = 3;
  string reason = 4;
}

message CancelResponse {
  // True if the executor knew the execution and signalled it to stop. False means it was
  // not held — already finished, or never received.
  //
  // A cancel that arrives after the handler has already succeeded does not erase that: the
  // executor still reports its real outcome, and the scheduler records success. Cancellation
  // requests a stop; it does not rewrite what happened.
  bool acknowledged = 1;
}

message GetExecutionRequest {
  string tenant = 1;
  string execution_key = 2;
}

message GetExecutionResponse {
  ExecutionState state = 1;

  // Which attempt the executor is reporting on. A scheduler that asked about token T2 and
  // is told about T1 must not adopt the answer: it describes a different attempt.
  string run_token = 6;

  // Set when state is EXECUTION_STATE_FINISHED.
  ExecutionOutcome outcome = 2;

  // Last handler-supplied progress message, if any.
  string message = 3;

  // RFC 3339 business time.
  string started_at = 4;
}

enum Disposition {
  DISPOSITION_UNSPECIFIED = 0;

  // The handler ran to completion.
  DISPOSITION_SUCCESS = 1;

  // The handler failed. Retryable unless failure_kind says otherwise.
  DISPOSITION_FAILED = 2;

  // The handler stopped because it was asked to — a Cancel, or proceed=false. This is the
  // confirmation that lets an execution reach `cancelled` rather than waiting for its lease
  // to expire and being recorded as fenced with side effects unverified.
  DISPOSITION_STOPPED = 3;

  // The handler was abandoned at timeout_seconds by the executor itself.
  DISPOSITION_TIMED_OUT = 4;
}

enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  EXECUTION_STATE_RUNNING = 1;
  EXECUTION_STATE_FINISHED = 2;
}

// ---------------------------------------------------------------------------
// JobScheduler messages
// ---------------------------------------------------------------------------

message RegisterRequest {
  // Unique per PROCESS: a restart produces a new id, so a restarted executor never
  // inherits its predecessor's registration and never has to clean one up.
  string executor_id = 1;

  // Logical executor that jobs route to. Instances share a group.
  //
  // A job may name a required group, which is how two groups declaring the same handler_key
  // — a partial rollout, or two configurations of one service — stay distinguishable. A job
  // that names none accepts any group declaring its handler.
  string group = 2;

  // The tenant this registration is for.
  //
  // A process may serve several tenants by calling Register once per tenant with the same
  // executor_id. Each registration carries its own handlers, capacity and in_flight set,
  // so one tenant's work is never routed on another tenant's evidence. Whether to run one
  // process per tenant or one process for all of them is a deployment decision, not a
  // constraint of this contract.
  string tenant = 3;

  // Where the scheduler reaches this instance for JobExecutor calls.
  string address = 4;

  // Executions this instance is currently running, declared at attach.
  //
  // This is how a scheduler learns the truth after either side restarts, without asking:
  // an executor that reconnects announces what it still holds, and the scheduler adopts or
  // fences accordingly. It is more reliable than querying, because only the executor knows
  // what it is actually doing.
  repeated InFlight in_flight = 5;
}

message InFlight {
  string execution_key = 1;
  string run_token = 2;
}

message RegisterResponse {
  int32 heartbeat_interval_seconds = 1;
  int32 registration_ttl_seconds = 2;

  // How often the executor's framework must call ReportProgress for a running execution.
  int32 progress_interval_seconds = 3;

  // Executions the scheduler no longer recognises. The executor must stop them: they were
  // fenced, cancelled, or belong to a generation that has moved on.
  repeated string fenced = 4;
}

message HeartbeatRequest {
  string executor_id = 1;

  // Required. Registrations are per tenant, and so is this heartbeat: a process serving
  // several tenants heartbeats once per tenant.
  string tenant = 2;

  int32 running = 3;
}

message HeartbeatResponse {
  // False means the registration lapsed; re-register rather than continuing to heartbeat.
  bool known = 1;
}

message ReportProgressRequest {
  // Required. execution_key is unique only WITHIN a tenant — two tenants may legitimately
  // hold the same job name and therefore the same key — so every callback must name its
  // tenant. Without it a load-balanced scheduler cannot tell which coordination schema to
  // write, and no in-memory mapping can help because callbacks are instance-agnostic.
  string tenant = 1;

  string execution_key = 2;
  string run_token = 3;

  // Optional, human-readable, for the admin UI. Liveness does not depend on it.
  string message = 4;
}

message ReportProgressResponse {
  // False means stop now: cancelled, or this attempt was fenced. An executor that keeps
  // working after this is outside the contract and its result will be refused.
  bool proceed = 1;

  // Renewed silence budget in seconds, counted from receipt of this response.
  int32 silence_deadline_seconds = 2;
}

message ReportResultRequest {
  // Required, for the same reason as ReportProgressRequest.tenant.
  string tenant = 1;

  string execution_key = 2;
  string run_token = 3;
  ExecutionOutcome outcome = 4;
}

message ExecutionOutcome {
  // What actually happened. REQUIRED: DISPOSITION_UNSPECIFIED is rejected.
  //
  // There is deliberately no boolean success field to fall back to. An earlier revision kept
  // one "so a rolling executor upgrade is not a flag day", which invented a compatibility
  // problem for a contract that has never been released — and made a real one: a boolean
  // cannot express STOPPED, so an executor that halted because it was cancelled would report
  // failure, and the scheduler would retry the very work an operator stopped. Mapping every
  // post-cancel failure to STOPPED is equally wrong, because a genuine failure racing the
  // cancel would be recorded as a cancellation. The information cannot be reconstructed, so
  // it must be sent.
  Disposition disposition = 1;

  // One line an operator reads in history.
  string summary = 2;

  // Short, stable, groupable — "timeout", "upstream_5xx", "validation". Not a message.
  string failure_kind = 3;

  // Detail for diagnosis. Truncated by the scheduler; do not rely on it being complete.
  string error_detail = 4;

  // Whether this pass actually processed anything.
  //
  // Only meaningful for FIXED_DELAY jobs, where the scheduler dispatches a pass every few
  // seconds and most passes find an empty queue. A pass reporting did_work=false leaves no
  // execution row: it is counted in metrics and forgotten, so a three-second poller does
  // not write tens of thousands of rows a day recording that there was nothing to do.
  //
  // CRON jobs ignore this field; their runs are always persisted, because a scheduled
  // instant that produced nothing is itself a fact worth keeping.
  bool did_work = 5;
}

message ReportResultResponse {
  // True when this exact (execution_key, run_token) result had already been recorded — a
  // redelivery after a lost response. The executor treats it as success and stops retrying.
  bool already_recorded = 1;
}
